  <g fill="#292642" stroke="#8179a6"><rect x="210" y="36" width="28" height="13" rx="4"/><rect x="394" y="36" width="28" height="13" rx="4"/><rect x="778" y="36" width="28" height="13" rx="4"/><rect x="962" y="36" width="28" height="13" rx="4"/></g>
  <path d="M216 49H232M400 49H416M784 49H800M968 49H984" stroke="#c8b4fc" stroke-width="3"/>
