<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" fill="none">
  <!-- Original BeatLink Party vector scenery. Authored by Codex, 2026-11-01.
       Editable master and runtime asset. No external imagery, fonts or performers. -->
  <defs>
    <linearGradient id="night" x1="600" y1="0" x2="600" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#171432"/><stop offset="1" stop-color="#090a19"/></linearGradient>
    <linearGradient id="ribbon" x1="245" y1="65" x2="950" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#74f4eb"/><stop offset=".38" stop-color="#7b99ff"/><stop offset=".7" stop-color="#bf6bef"/><stop offset="1" stop-color="#ff77b9"/></linearGradient>
    <linearGradient id="rim" x1="150" y1="365" x2="1050" y2="365" gradientUnits="userSpaceOnUse"><stop stop-color="#28d8dd"/><stop offset=".5" stop-color="#ad91ff"/><stop offset="1" stop-color="#ff669f"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b2a4ff" stop-opacity=".2"/><stop offset="1" stop-color="#8f83ff" stop-opacity="0"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#8370dd" stop-opacity=".2"/><stop offset="1" stop-color="#8370dd" stop-opacity="0"/></radialGradient>
    <linearGradient id="floor" x1="600" y1="335" x2="600" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#211d40"/><stop offset="1" stop-color="#0b0b1c"/></linearGradient>
    <pattern id="mesh" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 0H24V24" stroke="#a7a2dc" stroke-opacity=".045"/></pattern>
  </defs>
  <path fill="url(#night)" d="M0 0h1200v460H0z"/>
  <path fill="url(#mesh)" d="M0 0h1200v460H0z"/>
  <ellipse cx="600" cy="210" rx="540" ry="270" fill="url(#aura)"/>
