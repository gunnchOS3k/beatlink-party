  <path d="M304 28H896L1048 180L896 332H304L152 180Z" stroke="#32304d" stroke-width="2"/>
  <path d="M347 45H853L988 180L853 315H347L212 180Z" stroke="url(#ribbon)" stroke-opacity=".3" stroke-width="2"/>
  <path d="M376 70H824L934 180L824 290H376L266 180Z" stroke="url(#ribbon)" stroke-width="4"/>
