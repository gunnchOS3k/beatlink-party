name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json packageManager (pnpm@9.15.0)

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Fail on master as active base/default
        run: |
          set -euo pipefail
          if grep -RInE --include='*.yml' --include='*.yaml' \
            -e 'branches:[[:space:]]*\[[^]]*master' \
            -e 'default[_-]branch:[[:space:]]*master' \
            -e 'base:[[:space:]]*master' \
            .github/workflows 2>/dev/null; then
            echo "MAIN_BRANCH_POLICY_FAIL: active master default/base ref in workflows"
            exit 1
          fi
          echo "MAIN_BRANCH_POLICY_OK"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: |
          # game-engine resolves @beatlink/shared via package exports (dist types)
          pnpm --filter @beatlink/shared build
          pnpm typecheck

      - name: Test (includes Gate1 core-loop)
        run: pnpm test

      - name: Gate1 core-loop focused
        run: pnpm vitest run tests/gate1_core_loop.test.ts

      - name: Build smoke
        run: pnpm build

      - name: Upload synthetic Gate1 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-beatlink-synthetic-summary
          path: |
            gate1/evidence/out/*summary*.json
            gate1/status/gate1_core_loop_status.json
          if-no-files-found: ignore
          retention-days: 14
