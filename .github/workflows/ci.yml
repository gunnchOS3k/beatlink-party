name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json packageManager (pnpm@9.15.0)

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Fail on master as active base/default
        run: |
          set -euo pipefail
          if grep -RInE --include='*.yml' --include='*.yaml' \
            -e 'branches:[[:space:]]*\[[^]]*master' \
            -e 'default[_-]branch:[[:space:]]*master' \
            -e 'base:[[:space:]]*master' \
            .github/workflows 2>/dev/null; then
            echo "MAIN_BRANCH_POLICY_FAIL: active master default/base ref in workflows"
            exit 1
          fi
          echo "MAIN_BRANCH_POLICY_OK"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: |
          # Package exports resolve via dist types; `pnpm typecheck` builds
          # shared, game-engine, and device-ux before recursive tsc.
          pnpm typecheck

      - name: Test (Redis CI + Continuation VI SLOs + Gate1)
        run: pnpm test
        env:
          REDIS_URL: redis://127.0.0.1:6379
          BEATLINK_REDIS_CI: "1"
          # Default room store for non-Redis unit paths remains memory unless a test opts in.
          BEATLINK_ROOM_STORE: memory

      - name: Redis durable rooms focused
        run: pnpm vitest run tests/redis_ci.test.ts
        env:
          REDIS_URL: redis://127.0.0.1:6379
          BEATLINK_REDIS_CI: "1"

      - name: Continuation VI focused
        run: pnpm vitest run tests/continuation_vi.test.ts
        env:
          REDIS_URL: redis://127.0.0.1:6379
          BEATLINK_REDIS_CI: "1"
          BEATLINK_ROOM_STORE: memory

      - name: Gate1 core-loop focused
        run: pnpm vitest run tests/gate1_core_loop.test.ts

      - name: Build smoke
        run: pnpm build

      - name: Upload synthetic Gate1 + Continuation VI summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-beatlink-synthetic-summary
          path: |
            gate1/evidence/out/*summary*.json
            gate1/status/gate1_core_loop_status.json
            docs/continuation-v/network-load*.json
            docs/continuation-v/CONTINUATION_V_TOKENS.json
            docs/continuation-vi/**
            docs/release/beta_gap_audit.json
            docs/BETA_RC_TOKENS.json
          if-no-files-found: ignore
          retention-days: 14
