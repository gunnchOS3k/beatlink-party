name: Wave007 BeatLink Party Loop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave007-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave007:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Wave007 gate
        run: make wave007
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-wave007
          path: artifacts/engineering_wave007/
