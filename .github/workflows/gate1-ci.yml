name: Gate 1 post-merge integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate1-core-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json packageManager (pnpm@9.15.0)

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Fail on master as active base/default
        run: |
          set -euo pipefail
          if grep -RInE --include='*.yml' --include='*.yaml' \
            -e 'branches:[[:space:]]*\[[^]]*master' \
            -e 'default[_-]branch:[[:space:]]*master' \
            -e 'base:[[:space:]]*master' \
            .github/workflows 2>/dev/null; then
            echo "MAIN_BRANCH_POLICY_FAIL: active master default/base ref in workflows"
            exit 1
          fi
          echo "MAIN_BRANCH_POLICY_OK"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Package exports point at dist/; cross-process network load spawns the real server
      # via tsx and needs built @beatlink/shared + @beatlink/game-engine (same as primary CI typecheck).
      - name: Build workspace packages for server spawn
        run: pnpm --filter @beatlink/shared build && pnpm --filter @beatlink/game-engine build

      - name: Gate1 core-loop tests
        run: pnpm vitest run tests/gate1_core_loop.test.ts

      - name: Wave001 cross-device contract (RoomManager + scoring probes)
        run: |
          set -euo pipefail
          pip install 'jsonschema>=4.20'
          pnpm vitest run tests/cross_device_contract.test.ts
          test -f gate1/evidence/out/cross_device_contract.json
          python3 - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          from pathlib import Path
          doc = json.loads(Path("gate1/evidence/out/cross_device_contract.json").read_text())
          schema = json.loads(Path("gate1/contracts/cross_device_game_contract.v1.schema.json").read_text())
          Draft202012Validator(schema).validate(doc)
          assert doc["game_id"] == "beatlink-party"
          assert doc["probes"]["multiplayer"]["status"] == "pass"
          print("WAVE001_CROSS_DEVICE_CONTRACT_OK")
          PY

      - name: Gate1 suite smoke (vitest only; lint/typecheck tracked separately)
        run: pnpm vitest run
        env:
          REDIS_URL: redis://127.0.0.1:6379
          BEATLINK_REDIS_CI: "1"
          BEATLINK_ROOM_STORE: memory

      - name: Upload synthetic Gate1 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-core-loop-summary
          path: |
            gate1/evidence/out/*summary*.json
            gate1/status/gate1_core_loop_status.json
            docs/continuation-vi/**
            docs/release/beta_gap_audit.json
          if-no-files-found: ignore
          retention-days: 14
